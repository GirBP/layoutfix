<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>layoutfix</title>
<meta name="description" content="Безкоштовний застосунок для macOS: виправляє текст, набраний не тією розкладкою. Виділіть і тапніть праві ⌘ + ⌥.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B2A4A'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23E8B93B' font-family='monospace'%3E%E2%87%84%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #1B2A4A;
    --paper: #FAFAF7;
    --card: #FFFFFF;
    --night: #0E1526;
    --wheat: #E8B93B;
    --wheat-deep: #C99A1F;
    --steel: #5B6B8C;
    --line: #E3E2DA;
    --key-face: #F4F3EE;
    --key-edge: #CFCEC5;
    --demo-bg: #10182B;
    --demo-text: #E9ECF4;
    --sel: rgba(232, 185, 59, 0.35);
    --bg: var(--paper);
    --fg: var(--ink);
    --muted: var(--steel);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--night);
      --fg: #E9ECF4;
      --muted: #93A1C0;
      --card: #16203A;
      --line: #26314F;
      --key-face: #1D2843;
      --key-edge: #34405F;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--night);
    --fg: #E9ECF4;
    --muted: #93A1C0;
    --card: #16203A;
    --line: #26314F;
    --key-face: #1D2843;
    --key-edge: #34405F;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }

  /* ---------- nav ---------- */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0;
  }
  .logo {
    font-family: "Unbounded", "Manrope", sans-serif;
    font-weight: 700; font-size: 20px; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 10px; color: var(--fg);
    text-decoration: none;
  }
  .logo .glyph {
    display: inline-grid; place-items: center;
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--ink); color: var(--wheat);
    font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 600;
  }
  :root[data-theme="dark"] .logo .glyph { background: var(--wheat); color: var(--night); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .logo .glyph { background: var(--wheat); color: var(--night); }
  }
  .lang {
    display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 3px;
    font-size: 13px; font-weight: 700;
  }
  .lang button {
    border: 0; background: transparent; color: var(--muted);
    padding: 4px 12px; border-radius: 999px; cursor: pointer;
    font: inherit; letter-spacing: 0.04em;
  }
  .lang button.on { background: var(--fg); color: var(--bg); }
  .lang button:focus-visible { outline: 2px solid var(--wheat); outline-offset: 2px; }

  /* ---------- hero ---------- */
  header { padding: 44px 0 26px; }
  h1 {
    font-family: "Unbounded", sans-serif;
    font-size: clamp(30px, 5.4vw, 52px);
    font-weight: 700; line-height: 1.12; letter-spacing: -0.015em;
    margin: 0 0 14px; text-wrap: balance;
  }
  h1 .gold { color: var(--wheat-deep); }
  :root[data-theme="dark"] h1 .gold { color: var(--wheat); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) h1 .gold { color: var(--wheat); }
  }
  .sub { max-width: 60ch; color: var(--muted); font-size: 18px; margin: 0 0 26px; }

  /* demo terminal */
  .demo {
    background: var(--demo-bg); color: var(--demo-text);
    border-radius: 14px; padding: 26px 28px 22px;
    font-family: "IBM Plex Mono", monospace;
    box-shadow: 0 18px 50px -18px rgba(14, 21, 38, 0.55);
    border: 1px solid #26314F;
  }
  .demo .dots { display: flex; gap: 7px; margin-bottom: 18px; }
  .demo .dots i { width: 11px; height: 11px; border-radius: 50%; background: #33406166; }
  .demo .dots i:first-child { background: #E8B93B88; }
  .demo-line { font-size: clamp(22px, 4.4vw, 34px); min-height: 1.5em; font-weight: 500; }
  .demo-line .typed { border-radius: 4px; padding: 2px 4px; }
  .demo-line .typed.selected { background: var(--sel); }
  .demo-line .typed.fixed { color: var(--wheat); }
  .demo-line .caret {
    display: inline-block; width: 2px; height: 1.15em; background: var(--wheat);
    vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .demo-hint { margin-top: 16px; font-size: 13px; color: #8FA0C6; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .keycaps { display: inline-flex; gap: 6px; }
  .keycap {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600;
    background: linear-gradient(180deg, #202C4C, #182340);
    border: 1px solid #34405F; border-bottom-width: 3px;
    color: #DCE3F2; border-radius: 7px; padding: 4px 9px;
  }
  .keycap.lit { color: var(--wheat); border-color: #5a5330; box-shadow: 0 0 14px -4px var(--wheat); }

  .cta-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px;
    font-weight: 700; text-decoration: none; border-radius: 11px;
    padding: 13px 22px; font-size: 16px; border: 0; cursor: pointer;
  }
  .btn.primary { background: var(--wheat); color: #241C05; box-shadow: 0 10px 26px -10px var(--wheat-deep); }
  .btn.primary:hover { background: #F0C44E; }
  .btn.ghost { border: 1px solid var(--line); color: var(--fg); background: transparent; }
  .btn:focus-visible { outline: 2px solid var(--wheat-deep); outline-offset: 2px; }
  .cta-note { font-size: 13px; color: var(--muted); }

  /* ---------- sections ---------- */
  section { padding: 54px 0 8px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--wheat-deep); margin: 0 0 8px;
  }
  :root[data-theme="dark"] .eyebrow { color: var(--wheat); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .eyebrow { color: var(--wheat); }
  }
  h2 {
    font-family: "Unbounded", sans-serif; font-weight: 500;
    font-size: clamp(22px, 3.4vw, 30px); margin: 0 0 22px; letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 720px) { .steps { grid-template-columns: 1fr; } }
  .step {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 20px 18px;
  }
  .step .n {
    font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px;
    color: var(--wheat-deep); margin-bottom: 8px;
  }
  :root[data-theme="dark"] .step .n { color: var(--wheat); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .step .n { color: var(--wheat); }
  }
  .step h3 { margin: 0 0 6px; font-size: 16.5px; }
  .step p { margin: 0; font-size: 14.5px; color: var(--muted); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .feat {
    border: 1px solid var(--line); border-radius: 14px; padding: 20px;
    background: var(--card);
  }
  .feat .ic { font-size: 22px; margin-bottom: 10px; }
  .feat h3 { margin: 0 0 6px; font-size: 17px; }
  .feat p { margin: 0; font-size: 14.5px; color: var(--muted); }
  .feat kbd {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
    background: var(--key-face); border: 1px solid var(--key-edge); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px;
  }

  details {
    border-bottom: 1px solid var(--line); padding: 4px 0;
  }
  details summary {
    cursor: pointer; font-weight: 700; padding: 13px 0; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; font-family: "IBM Plex Mono", monospace; color: var(--muted); }
  details[open] summary::after { content: "–"; }
  details p { margin: 0 0 16px; color: var(--muted); font-size: 15px; max-width: 68ch; }
  details code {
    font-family: "IBM Plex Mono", monospace; font-size: 13px;
    background: var(--key-face); border-radius: 5px; padding: 1px 6px;
  }


  footer {
    margin-top: 70px; padding: 26px 0 40px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    color: var(--muted); font-size: 14px;
  }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .demo-line .caret { animation: none; }
  }
</style>

</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="#"><span class="glyph">⇄</span>layoutfix</a>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-uk" onclick="setLang('uk')">UA</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
  </nav>

  <header>
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub"></p>

    <div class="demo" aria-label="Demo">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="demo-line"><span class="typed" id="demo-text"></span><span class="caret" id="demo-caret"></span></div>
      <div class="demo-hint">
        <span class="keycaps"><span class="keycap" id="cap-cmd">R ⌘</span><span class="keycap" id="cap-opt">R ⌥</span></span>
        <span data-i18n="demoHint"></span>
      </div>
    </div>

    <div class="cta-row">
      <a class="btn primary" id="btn-download" href="#" data-i18n="ctaDownload"></a>
      <a class="btn ghost" href="#how" data-i18n="ctaHow"></a>
      <span class="cta-note" data-i18n="ctaNote"></span>
    </div>
  </header>

  <section id="how">
    <p class="eyebrow" data-i18n="stepsEyebrow"></p>
    <h2 data-i18n="stepsH2"></h2>
    <div class="steps">
      <div class="step"><div class="n">01</div><h3 data-i18n="s1h"></h3><p data-i18n="s1p"></p></div>
      <div class="step"><div class="n">02</div><h3 data-i18n="s2h"></h3><p data-i18n="s2p"></p></div>
      <div class="step"><div class="n">03</div><h3 data-i18n="s3h"></h3><p data-i18n="s3p"></p></div>
    </div>
  </section>

  <section>
    <p class="eyebrow" data-i18n="featEyebrow"></p>
    <h2 data-i18n="featH2"></h2>
    <div class="grid">
      <div class="feat"><div class="ic">⌨️</div><h3 data-i18n="f1h"></h3><p data-i18n="f1p"></p></div>
      <div class="feat"><div class="ic">🌍</div><h3 data-i18n="f2h"></h3><p data-i18n="f2p"></p></div>
      <div class="feat"><div class="ic">🔒</div><h3 data-i18n="f3h"></h3><p data-i18n="f3p"></p></div>
      <div class="feat"><div class="ic">⚡</div><h3 data-i18n="f4h"></h3><p data-i18n="f4p"></p></div>
    </div>
  </section>

  <section>
    <p class="eyebrow">FAQ</p>
    <h2 data-i18n="faqH2"></h2>
    <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
    <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
    <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
    <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
    <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
  </section>

  <footer>
    <span data-i18n="footMade"></span>
    <span><a id="btn-github" href="#">GitHub</a> · <a href="https://github.com/GirBP/layoutfix/issues" data-i18n="footContact"></a></span>
  </footer>
</div>

<script>
  const LINKS = {
    download: "https://github.com/GirBP/layoutfix/releases/latest/download/layoutfix.dmg",
    github:   "https://github.com/GirBP/layoutfix",
  };
  document.getElementById("btn-download").href = LINKS.download;
  document.getElementById("btn-github").href = LINKS.github;

  /* ====== i18n ====== */
  const T = {
    uk: {
      h1: 'Набрали <span class="gold">ghbdsn</span> замість <span class="gold">привіт</span>?',
      sub: "layoutfix виправляє текст, набраний не тою розкладкою: виділіть його, тапніть праві ⌘ + ⌥ — і готово. Безкоштовний застосунок для macOS, працює повністю офлайн.",
      demoHint: "— виділіть текст і тапніть праві Command + Option",
      ctaDownload: "Завантажити для macOS",
      ctaHow: "Як встановити",
      ctaNote: "macOS 12+ · Apple Silicon та Intel · безкоштовно",
      stepsEyebrow: "Встановлення",
      stepsH2: "Три кроки — і працює",
      s1h: "Перетягніть у Програми",
      s1p: "Відкрийте завантажений DMG і перетягніть layoutfix у теку Програми (Applications).",
      s2h: "Відкрийте застосунок",
      s2p: "Перший запуск macOS заблокує. Відкрийте Системні параметри → Приватність і безпека й натисніть «Усе одно відкрити» (Open Anyway). Потрібно лише раз.",
      s3h: "Увімкніть Accessibility",
      s3p: "Застосунок сам відкриє потрібну панель і повідомить, щойно все запрацює. Один перемикач — і готово.",
      featEyebrow: "Можливості",
      featH2: "Ваші клавіші. Ваші правила.",
      f1h: "Гарячі клавіші — як зручно вам",
      f1p: "Циклічна конвертація одним акордом (типово — праві <kbd>⌘</kbd>+<kbd>⌥</kbd>) або окрема комбінація на кожну мову (<kbd>⌘⌥1</kbd>, <kbd>⌘⌥2</kbd>…). Все змінюється у меню за два кліки.",
      f2h: "Будь-які розкладки",
      f2p: "layoutfix читає мапи клавіш прямо з macOS, тож працює з будь-якою парою розкладок — українська, англійська, німецька, польська…",
      f3h: "Приватний та офлайн",
      f3p: "Жодного інтернету, жодної аналітики, жодних серверів. Ваш текст ніколи не покидає ваш Mac.",
      f4h: "Миттєвий",
      f4p: "Спрацьовує в момент відпускання клавіш. Акорд із самих модифікаторів не конфліктує з жодним шорткатом жодного застосунку.",
      faqH2: "Питання, які ви точно поставите",
      q1: "Навіщо застосунку дозвіл Accessibility?",
      a1: "Щоб прочитати виділений текст і замінити його виправленим, macOS вимагає цей дозвіл — так працює будь-який подібний інструмент. layoutfix використовує його лише в момент натискання вашої комбінації і ніколи не стежить за тим, що ви друкуєте.",
      q2: "macOS пише, що «не може перевірити розробника»",
      a2: "Це стандартне попередження для застосунків поза App Store без платного сертифіката Apple. Відкрийте Системні параметри → Приватність і безпека, прокрутіть донизу й натисніть «Усе одно відкрити» (Open Anyway). Потрібно лише раз.",
      q3: "Чи надсилає layoutfix щось в інтернет?",
      a3: "Ні. Застосунок не має жодного мережевого коду: конвертація відбувається локально, оновлення ви завантажуєте самі. Це легко перевірити фаєрволом.",
      q4: "Як змінити комбінацію клавіш?",
      a4: "Клацніть іконку ⇄ в рядку меню → «Гаряча клавіша циклу» або «Клавіші для мови» — і виберіть зі списку. Зміни діють одразу, без перезапуску.",
      q5: "Скільки це коштує?",
      a5: "Нічого: layoutfix безкоштовний.",
      footMade: "Зроблено в Україні 🇺🇦",
      footContact: "Звʼязок",
      docTitle: "layoutfix — виправлення розкладки для macOS",
    },
    en: {
      h1: 'Typed <span class="gold">ghbdsn</span> instead of <span class="gold">привіт</span>?',
      sub: "layoutfix converts text typed in the wrong keyboard layout: select it, tap right ⌘ + ⌥ — done. A free macOS menu-bar app that works fully offline.",
      demoHint: "— select the text and tap right Command + Option",
      ctaDownload: "Download for macOS",
      ctaHow: "How to install",
      ctaNote: "macOS 12+ · Apple Silicon & Intel · free",
      stepsEyebrow: "Install",
      stepsH2: "Three steps and it works",
      s1h: "Drag to Applications",
      s1p: "Open the downloaded DMG and drag layoutfix into your Applications folder.",
      s2h: "Open the app",
      s2p: "macOS blocks the first launch. Open System Settings → Privacy & Security and click “Open Anyway”. Needed only once.",
      s3h: "Grant Accessibility",
      s3p: "The app opens the right pane for you and confirms the moment everything works. One toggle — done.",
      featEyebrow: "Features",
      featH2: "Your keys. Your rules.",
      f1h: "Hotkeys the way you like them",
      f1p: "Cycle conversion with one chord (default: right <kbd>⌘</kbd>+<kbd>⌥</kbd>) or a dedicated hotkey per language (<kbd>⌘⌥1</kbd>, <kbd>⌘⌥2</kbd>…). Change everything from the menu in two clicks.",
      f2h: "Any keyboard layouts",
      f2p: "layoutfix reads key maps straight from macOS, so it works with any pair of layouts — Ukrainian, English, German, Polish…",
      f3h: "Private & offline",
      f3p: "No internet, no analytics, no servers. Your text never leaves your Mac.",
      f4h: "Instant",
      f4p: "Fires the moment you release the keys. A modifier-only chord conflicts with no shortcut in no app.",
      faqH2: "Questions you will definitely ask",
      q1: "Why does the app ask for Accessibility permission?",
      a1: "To read the selected text and replace it with the fixed version, macOS requires this permission — every tool of this kind works this way. layoutfix uses it only at the moment you press your hotkey and never watches what you type.",
      q2: "macOS says it “cannot verify the developer”",
      a2: "That's the standard warning for apps outside the App Store without Apple's paid certificate. Open System Settings → Privacy & Security, scroll down and click “Open Anyway”. Needed only once.",
      q3: "Does layoutfix send anything to the internet?",
      a3: "No. The app contains no networking code at all: conversion happens locally and updates are downloaded by you. Easy to verify with a firewall.",
      q4: "How do I change the hotkey?",
      a4: "Click the ⇄ icon in the menu bar → “Cycle hotkey” or “Per-language keys” — and pick from the list. Changes apply instantly, no restart.",
      q5: "How much does it cost?",
      a5: "Nothing: layoutfix is free.",
      footMade: "Made in Ukraine 🇺🇦",
      footContact: "Contact",
      docTitle: "layoutfix — fix wrong keyboard layout on macOS",
    },
  };

  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = T[lang][el.dataset.i18n];
      if (v !== undefined) el.innerHTML = v;
    });
    document.title = T[lang].docTitle;
    document.getElementById("lang-uk").classList.toggle("on", lang === "uk");
    document.getElementById("lang-en").classList.toggle("on", lang === "en");
    try { localStorage.setItem("lf-lang", lang); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem("lf-lang"); } catch (e) {}
  const auto = (navigator.language || "").toLowerCase().startsWith("uk") ? "uk" : "en";
  setLang(saved === "uk" || saved === "en" ? saved : (auto === "uk" ? "uk" : "uk"));
  /* примітка: за замовчуванням укр; авто-EN вмикається лише якщо система не українська */
  if (!saved && auto === "en") setLang("en");

  /* ====== hero demo loop ====== */
  const pairs = [
    { wrong: "ghbdsn", right: "привіт" },
    { wrong: "руддщ", right: "hello" },
    { wrong: "hjprkflrf", right: "розкладка" },
  ];
  const el = document.getElementById("demo-text");
  const caret = document.getElementById("demo-caret");
  const capCmd = document.getElementById("cap-cmd");
  const capOpt = document.getElementById("cap-opt");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function demoLoop() {
    if (reduced) { el.textContent = "ghbdsn → привіт"; el.classList.add("fixed"); caret.style.display = "none"; return; }
    let i = 0;
    for (;;) {
      const { wrong, right } = pairs[i % pairs.length];
      el.className = "typed"; el.textContent = "";
      await sleep(700);
      for (const ch of wrong) { el.textContent += ch; await sleep(95 + Math.random() * 90); }
      await sleep(650);
      el.classList.add("selected"); caret.style.visibility = "hidden";
      await sleep(600);
      capCmd.classList.add("lit"); capOpt.classList.add("lit");
      await sleep(420);
      el.classList.remove("selected"); el.classList.add("fixed");
      el.textContent = right;
      capCmd.classList.remove("lit"); capOpt.classList.remove("lit");
      caret.style.visibility = "visible";
      await sleep(2100);
      i++;
    }
  }
  demoLoop();
</script>
</body>
</html>
